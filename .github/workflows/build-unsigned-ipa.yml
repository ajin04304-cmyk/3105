name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/3105.app Payload/
          zip -qry 3105-2.0.1-unsigned.ipa Payload
          /usr/libexec/PlistBuddy -c "Print :AppReleaseDisplayVersion" Payload/3105.app/Info.plist || true
          ls -lh 3105-2.0.1-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-2.0.1-unsigned.ipa
          if-no-files-found: error
